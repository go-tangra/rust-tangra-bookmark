# bookmark join bundle, rendered by the gateway's add-module wizard.
#   docker compose up -d
# Values come from .env (written by the gateway: core addresses, generated
# passwords and the host inputs you gave). private/ holds the single-use
# enrolment token, the mesh CA and this bundle's own TLS material. Only the
# two mesh ports are published; the database stays on the bundle's private
# network.
name: tangra-bookmark
services:
  bookmark-db:
    image: postgres:16.9-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: bookmark
      POSTGRES_PASSWORD: ${GEN_PASSWORD_1}
      BOOKMARK_APP_PASSWORD: ${GEN_PASSWORD_2}
    # The server key must belong to the postgres user: copy it before start.
    entrypoint: ["sh", "-c", "install -d -o postgres -m 0700 /tls-pg && install -o postgres -m 0600 /tls/bookmark-db.key /tls-pg/server.key && install -o postgres -m 0644 /tls/bookmark-db.crt /tls-pg/server.crt && exec docker-entrypoint.sh \"$$@\"", "--"]
    command: ["postgres", "-c", "ssl=on", "-c", "ssl_cert_file=/tls-pg/server.crt", "-c", "ssl_key_file=/tls-pg/server.key"]
    volumes:
      - bookmark-db:/var/lib/postgresql/data
      - ./private/tls:/tls:ro
      - ./init-db.sh:/docker-entrypoint-initdb.d/10-app-role.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bookmark"]
      interval: 5s
      retries: 30
  # Applies the schema (as the owner) before the service starts, and hands
  # the state volume to the image's unprivileged user (uid 10001).
  bookmark-bootstrap:
    image: ${MODULE_IMAGE}:${MODULE_VERSION}
    user: "0:0"
    entrypoint: ["sh", "-c", "chown 10001:10001 /state && exec bookmarksvc bootstrap -config /app/config.yaml"]
    volumes: &bookmark-volumes
      - ./config.yaml:/app/config.yaml:ro
      - ./policy.yaml:/app/policy.yaml:ro
      - ./private/enrollment.token:/tokens/enrollment.token:ro
      - ./private/tls/ca.pem:/tls/ca.pem:ro
      - bookmark-state:/state
    depends_on:
      bookmark-db: { condition: service_healthy }
  bookmark:
    image: ${MODULE_IMAGE}:${MODULE_VERSION}
    restart: unless-stopped
    command: ["-config", "/app/config.yaml"]
    environment:
      FREYA_ADVERTISE_HOST: ${MODULE_ADVERTISE_HOST}
    ports:
      - "${MODULE_BIND_IP}:9975:9975"
      - "${MODULE_BIND_IP}:9976:9976"
    volumes: *bookmark-volumes
    # The image has no wget/curl: the binary probes its own admin /readyz.
    healthcheck:
      test: ["CMD", "bookmarksvc", "--healthcheck", "-config", "/app/config.yaml"]
      interval: 10s
      timeout: 3s
      retries: 30
      start_period: 20s
    depends_on:
      bookmark-bootstrap: { condition: service_completed_successfully }
volumes:
  bookmark-db: {}
  bookmark-state: {}
